# P0-10-D: nginx 安全加固
# - listen 8080（nginx-unprivileged 镜像非 root 用户无法监听 80）
# - 安全响应头
# - client_max_body_size（匹配后端 MAX_FILE_SIZE_DOCUMENT=50MB）
# - 修复 SSE location 路径（/chat/stream 而非 /messages/stream）
# P2-11: 隐藏 nginx 版本号，防止指纹识别
server_tokens off;

server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # P0-10-D: 上传大小限制（50MB，匹配后端文档上限）
    client_max_body_size 50M;

    # P0-10-D: 安全响应头（OWASP 推荐基线）
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # P2-T13: 补充 X-Permitted-Cross-Domain-Policies 安全头
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header X-Download-Options "noopen" always;
    # P2-11: 移除 X-XSS-Protection（现代浏览器已废弃，CSP 提供更好保护）
    # CSP：允许 self + inline 样式（Vue/React 需要）+ data:/https: 图像/字体 + API 连接
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data: https:; connect-src 'self' https: wss: ws:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # AUD-27: 运行时配置由容器启动时生成，必须禁止缓存，
    # 否则浏览器/CDN 会长期持有旧的 API 地址。
    location = /config.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # P2-11: 后端 SSE 全局超时 300s，普通 API 设置 300s 足够
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
    }

    # P0-10-D: 修复 SSE location 路径
    # 匹配 /api/v1/agents/{id}/chat/stream（含版本号前缀）
    location ~ ^/api/v1/agents/[^/]+/chat/stream$ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 必须：禁用缓冲 + 禁用缓存
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        # P2-11: 与后端 _SSE_GLOBAL_TIMEOUT_SECONDS=300s 对齐，加 60s 缓冲
        proxy_read_timeout 360s;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # A2: 协作工作台服务反向代理
    # /collab-api/* → collaboration-service:3001/api/* （路径重写，去掉前缀）
    location /collab-api/ {
        proxy_pass http://collaboration-service:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
    }

    # A2: 协作工作台 WebSocket 反向代理
    # /collab-ws → collaboration-service:3001/ws （路径重写，去掉前缀）
    location /collab-ws {
        proxy_pass http://collaboration-service:3001/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 360s;
    }

    # 本地工具桥接：本地守护进程（Local Runner）主动外连的 /bridge WebSocket 端点。
    # 云端单域名部署下，用户本机 Runner 通过 wss://<域名>/bridge 连入协作服务。
    location /bridge {
        proxy_pass http://collaboration-service:3001/bridge;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 360s;
    }

    # 本地工具桥接：本地守护进程分发包静态托管（install.ps1 与 local-runner.zip）。
    # 用户在本机执行 irm https://<域名>/local-runner/install.ps1 | iex 一键安装。
    location /local-runner/ {
        alias /usr/share/nginx/html/local-runner/;
        add_header Cache-Control "no-cache";
        # 注入实际部署域名：install.ps1 中的 __AUTOTEAMS_DOMAIN__ 会被替换为 $scheme://$host，
        # 使用户在 irm|iex 场景无需设置任何环境变量即可自动解析 local-runner.zip 下载地址。
        # local-runner.zip 为二进制、不含该占位符，sub_filter 对其为无害的空操作。
        sub_filter_once on;
        sub_filter '__AUTOTEAMS_DOMAIN__' '$scheme://$host';
        sub_filter_types text/plain application/octet-stream;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    # P2-T13: 移除 application/json，防止 BREACH 攻击（HTTPS + 压缩 + 敏感数据场景）
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml image/svg+xml;
    gzip_disable "MSIE [1-6]\.";
}
