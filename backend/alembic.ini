# Alembic Configuration for AutoTeams
# Database schema initialization MUST be done via migrations:
#   cd backend && alembic upgrade head

[alembic]
# Migration scripts directory
script_location = migrations

# Database URL (overridden by env.py at runtime from app.database.DATABASE_URL)
sqlalchemy.url = sqlite+aiosqlite:///./autoteams.db

# Migration script naming
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
